name: Sync patch onto upstream

# Keeps the `share-store-public` patch replayed on top of the newest upstream
# release *within the version line this fork can consume* (see
# `UPSTREAM_SERIES_RE`), so a ready-to-use branch already exists when someone
# needs to move up a version.
#
# It never writes to `share-store-public` itself. Each run refreshes the
# throwaway branch `share-store-public-next` and, once the replay checks out,
# opens a pull request against `share-store-public` for a human to weigh.
#
# The standing issue is reserved for the one thing a pull request cannot carry:
# the patch no longer landing. It is rewritten in place rather than reopened per
# run, and closed as soon as a run comes back clean -- upstream ships releases
# far more often than this patch needs to move, and one notification per run
# would be pure noise.
#
# The type-check step is the point of the whole job. A clean cherry-pick only
# proves the surrounding text is unchanged; it says nothing about whether the
# declarations being widened still exist. If upstream renames `ShareStoreView`
# or reshapes its `init`, the cherry-pick succeeds and the branch is silently
# useless. Building a throwaway package *outside* the Pulse package is the only
# thing that actually exercises the public surface.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: sync-patch-onto-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/kean/Pulse.git
  PATCH_BRANCH: share-store-public
  NEXT_BRANCH: share-store-public-next
  REPORT_TITLE: Upstream sync status
  # The version line this fork can actually consume. `ShareStoreView` is
  # `@available(iOS 16, ...)` through 5.1.x and `@available(iOS 18, ...)` from
  # 5.2.0 on, while the app consuming this fork ships an iOS 16 deployment
  # target -- so following "newest release overall" would hand it a branch it
  # cannot compile against. Package-level `platforms` says iOS 15 in both, and
  # is no help here; the constraint lives on the declaration.
  #
  # The type-check probe below encodes the same iOS 16 floor. These two are one
  # decision expressed twice: raise them together, never one alone.
  UPSTREAM_SERIES_RE: '^5\.1(\.[0-9]+)?$'

jobs:
  sync:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream tags
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch --quiet upstream --tags

      - name: Resolve newest upstream release on our version line
        id: target
        run: |
          # Anchored X.Y or X.Y.Z within our line -- the trailing anchor also
          # skips the patch tags published from this repository, which carry a
          # pre-release suffix. Sorting is git's own version sort, so this does
          # not depend on whichever `sort` happens to be on the runner.
          TAG=$(git tag -l --sort=v:refname | grep -E "$UPSTREAM_SERIES_RE" | tail -1)
          if [ -z "$TAG" ]; then
            echo "::error::No upstream release tag matches $UPSTREAM_SERIES_RE."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Newest upstream release on $UPSTREAM_SERIES_RE: $TAG"

      - name: Check whether the patch already sits on that release
        id: check
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          # Peel to a commit: upstream tags may be annotated, and
          # `--is-ancestor` wants commits on both sides.
          if git merge-base --is-ancestor "refs/tags/$TAG^{commit}" "origin/$PATCH_BRANCH"; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "$PATCH_BRANCH already contains $TAG. Nothing to do."
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Replay the patch on the new release
        id: replay
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$NEXT_BRANCH" "refs/tags/$TAG"
          if git cherry-pick "origin/$PATCH_BRANCH"; then
            echo "replayed=true" >> "$GITHUB_OUTPUT"
          else
            git cherry-pick --abort || true
            echo "replayed=false" >> "$GITHUB_OUTPUT"
            echo "The patch does not replay onto $TAG. Reporting instead of failing."
          fi

      - name: Type-check the widened API from outside the package
        id: probe
        if: steps.replay.outputs.replayed == 'true'
        # Swallowed here so a failing probe can be reported rather than just
        # painting the run red; the last step re-raises it.
        continue-on-error: true
        run: |
          PROBE="$RUNNER_TEMP/probe"
          mkdir -p "$PROBE/Sources/ShareProbe"

          # The package identity of a path dependency comes from the directory
          # name, not from the manifest, so this only resolves because the
          # checkout directory is called `Pulse`.
          cat > "$PROBE/Package.swift" <<EOF
          // swift-tools-version:5.10
          import PackageDescription

          let package = Package(
              name: "ShareProbe",
              platforms: [.iOS(.v16), .macOS(.v13)],
              dependencies: [.package(path: "$GITHUB_WORKSPACE")],
              targets: [
                  .target(name: "ShareProbe", dependencies: [
                      .product(name: "Pulse", package: "Pulse"),
                      .product(name: "PulseUI", package: "Pulse"),
                  ])
              ]
          )
          EOF

          cat > "$PROBE/Sources/ShareProbe/Probe.swift" <<'EOF'
          import SwiftUI
          import Pulse
          import PulseUI

          // Touches every declaration this patch widens. Compiles only if all of
          // them are reachable from outside the Pulse package.
          @available(iOS 16, macOS 13, *)
          enum ShareProbe {
              static func makeSheet() -> some View {
                  ShareStoreView(sessions: [], onDismiss: {})
                      .environment(\.store, LoggerStore.shared)
              }
          }
          EOF

          swift build --package-path "$PROBE"

      - name: Publish the refreshed branch
        if: steps.probe.outcome == 'success'
        run: |
          # A lease needs something to lease against, and on the very first run
          # the branch does not exist yet.
          if git ls-remote --exit-code --heads origin "$NEXT_BRANCH" >/dev/null 2>&1; then
            git push --force-with-lease origin "$NEXT_BRANCH"
          else
            git push origin "$NEXT_BRANCH"
          fi

      - name: Open or refresh the pull request
        if: steps.probe.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This repository is a fork, and `gh` resolves a fork's operations to
          # the parent by default -- which lands on kean/Pulse, where this token
          # has no business writing. Pin it.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          TITLE="Move the patch onto upstream $TAG"
          BODY=$(cat <<BODY
          \`$NEXT_BRANCH\` carries the patch on upstream \`$TAG\`, and a throwaway
          package built outside Pulse confirms the widened declarations are still
          reachable.

          Merging is a deliberate act, not a formality. Moving \`$PATCH_BRANCH\`
          forward changes which upstream release consumers get, so read the
          upstream release notes -- the deployment target above all -- first.
          After merging, publish a tag: the next run rewrites \`$NEXT_BRANCH\`,
          and an untagged commit stops being referenceable the moment it does.

          Leaving this open is a valid answer. The branch and this description are
          refreshed in place on every run, so nothing rots while it waits.
          BODY
          )

          NUMBER=$(gh pr list --state open --base "$PATCH_BRANCH" --head "$NEXT_BRANCH" \
            --json number --jq 'first | .number // empty')

          if [ -n "$NUMBER" ]; then
            # The branch was just force-refreshed, so an open pull request already
            # points at the new commit -- only its prose is stale.
            gh pr edit "$NUMBER" --title "$TITLE" --body "$BODY"
            echo "Updated PR #$NUMBER."
          else
            gh pr create --base "$PATCH_BRANCH" --head "$NEXT_BRANCH" \
              --title "$TITLE" --body "$BODY"
          fi

          {
            echo "## Upstream sync"
            echo
            echo "$BODY"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep one standing report
        if: always() && (steps.replay.outputs.replayed == 'false' || steps.probe.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same fork/parent hazard as above.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.target.outputs.tag }}
          REPLAYED: ${{ steps.replay.outputs.replayed }}
        run: |
          if [ "$REPLAYED" = "false" ]; then
            BODY=$(cat <<BODY
          The patch no longer replays cleanly onto upstream \`$TAG\`, so
          \`$NEXT_BRANCH\` was left untouched and nothing was published.

          Either the surrounding code moved far enough that the conflict needs a
          human, or upstream widened these declarations itself and the patch is
          now redundant. Resolve it by hand on top of \`$TAG\`, push the result
          to \`$PATCH_BRANCH\`, and tag it.

          This issue is rewritten in place on every run and closed as soon as a
          run comes back clean, so it stays quiet until the situation changes.
          BODY
          )
          else
            BODY=$(cat <<BODY
          The patch still replays onto upstream \`$TAG\`, but a throwaway package
          built outside Pulse no longer compiles against it -- the declarations
          this patch widens have been renamed, reshaped, or removed. Nothing was
          published.

          This is exactly the case a clean cherry-pick cannot detect. Read the log
          of the failing step, rework the patch on top of \`$TAG\`, push the
          result to \`$PATCH_BRANCH\`, and tag it.

          This issue is rewritten in place on every run and closed as soon as a
          run comes back clean, so it stays quiet until the situation changes.
          BODY
          )
          fi

          NUMBER=$(gh issue list --state open --json number,title \
            --jq "[.[] | select(.title == \"$REPORT_TITLE\")] | first | .number // empty")

          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --body "$BODY"
            echo "Updated issue #$NUMBER."
          else
            gh issue create --title "$REPORT_TITLE" --body "$BODY"
          fi

          {
            echo "## Upstream sync"
            echo
            echo "$BODY"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Close the standing report once a run comes back clean
        if: steps.check.outputs.up_to_date == 'true' || steps.probe.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same fork/parent hazard as above.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          # A report that outlives the situation it described is worse than no
          # report at all: it teaches everyone to ignore the issue tracker.
          NUMBER=$(gh issue list --state open --json number,title \
            --jq "[.[] | select(.title == \"$REPORT_TITLE\")] | first | .number // empty")
          if [ -z "$NUMBER" ]; then
            echo "No standing report open. Nothing to close."
            exit 0
          fi

          gh issue close "$NUMBER" --comment "Nothing outstanding as of upstream \`$TAG\`. A later run opens a fresh report if that changes."
          echo "Closed issue #$NUMBER."

      - name: Surface the failed probe
        if: steps.probe.outcome == 'failure'
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          # The probe swallowed its own failure so the report could be written.
          # Give the run the red it earned.
          echo "::error::The widened API no longer type-checks against $TAG. See the standing issue."
          exit 1
